[package]
name = "cage"
version = "0.4.1-pre7"
authors = ["Eric Kidd <git@randomhacks.net>",
           "Seamus Abshere <seamus@abshere.net>"]
edition = "2021"

description = "Develop multi-pod docker-compose apps"
license = "MIT/Apache-2.0"
readme = "README.md"
repository = "https://github.com/faradayio/cage"
documentation = "https://docs.rs/cage/"
homepage = "http://cage.faraday.io/"

[badges]
appveyor = { repository = "faradayio/cage", branch = "master", service = "github" }
travis-ci = { repository = "faradayio/cage", branch = "master" }

[[bin]]
name = "cage"
doc = false
test = true

[dev-dependencies]
cli_test_dir = "0.1.8"
copy_dir = "0.1"

[dependencies]
bollard = "0.21"
clap = { version = "4.6", features = ["derive", "string"] }
clap_complete = "4.6"
colored = "3.1"
faraday_compose_yml = { git = "https://github.com/faradayio/compose_yml" }
dirs = "7.0"
env_logger = "0.11"
anyhow = "1.0"
thiserror = "2.0"
glob = "0.3"
handlebars = "6.4"
vaultrs = "0.8"
include_dir = "0.7"
itertools = "0.15"
lazy_static = "1.5"
log = "0.4.33"
rand = "0.10"
rayon = "1.12.0"
regex = "1.13.1"
retry = "2.2"
semver = "1.0"
serde = "1.0"
serde_derive = "1.0"
serde_json = "1.0"
serde-saphyr = "2.0"
shlex = "2.0"
tokio = { version = "1", features = ["rt", "macros", "net", "time"] }
url = "2.5.8"
